<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ultimate Kit</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <button class="icon-btn" id="btnBack" title="Back" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="brand" id="brand">
        <span class="logo" aria-hidden="true"></span>
        <span class="title" id="pageTitle">Ultimate Kit</span>
      </div>
      <div class="spacer"></div>
      <button class="svg-btn" id="btnW2P" title="Word to Path: the selected text layers become one shape layer per letter">
        <svg viewBox="0 0 24 24"><path d="M4 19L9 5l5 14M6 14h6"/><circle cx="18" cy="8" r="1.6"/><circle cx="18" cy="17" r="1.6"/><path d="M18 9.6v5.8" opacity=".6"/></svg><span>Word to Path</span>
      </button>
      <button class="svg-btn" id="btnSvg" title="Import an SVG file as a shape layer (or drop an .svg on the panel)">
        <svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10-3-3L5 16z"/><path d="M13 6l3 3"/></svg><span>Import SVG</span>
      </button>
    </header>
    <main id="view"></main>
    <footer class="bar" id="bar">
      <div class="status" id="status"></div>
      <button class="btn primary" id="btnApply">Apply</button>
    </footer>
  </div>
  <script src="shared/catalog.js"></script>

  <script src="js/cardprev.js"></script>
  <script src="js/slotprev.js"></script>
<script src="shared/tiles.js"></script>
<script src="js/tilesprev.js"></script>
