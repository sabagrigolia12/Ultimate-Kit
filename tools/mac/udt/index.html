<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <style>
      body { margin: 0; padding: 16px; color: var(--uxp-host-text-color, #e8e8e8); background: var(--uxp-host-background-color, #1e1e1e); font-size: 13px; }
      .title { font-size: 17px; font-weight: bold; margin-bottom: 4px; }
      .sub { opacity: 0.7; margin-bottom: 16px; }
      .row { display: flex; flex-direction: row; margin-bottom: 14px; }
      .row sp-button { margin-right: 8px; }
      #status { white-space: pre-wrap; line-height: 1.5; padding: 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.06); min-height: 40px; }
      #status.ok { background: rgba(60, 170, 100, 0.22); }
      #status.err { background: rgba(220, 70, 70, 0.25); }
      #where { margin-top: 12px; opacity: 0.55; font-size: 11px; white-space: pre-wrap; }
    </style>
    <script src="index.js"></script>
  </head>
  <body>
    <div class="title">Ultimate Kit</div>
    <div class="sub">After Effects</div>
    <div class="row">
      <sp-button id="install" variant="cta">Install</sp-button>
      <sp-button id="uninstall" variant="secondary">Uninstall</sp-button>
    </div>
    <div id="status"></div>
    <div id="where"></div>
  </body>
</html>
